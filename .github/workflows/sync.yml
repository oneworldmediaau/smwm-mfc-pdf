   name: Reporting sync
   on:
     schedule:
       - cron: "*/15 * * * *"
     workflow_dispatch:
   jobs:
     sync:
       runs-on: ubuntu-latest
       timeout-minutes: 3
       steps:
         - name: Run sync
           run: curl -fsS --max-time 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://smwm-mfc-pdf-five.vercel.app/api/sync
